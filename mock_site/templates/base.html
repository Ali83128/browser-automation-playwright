<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Acme Leads Portal{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #f4f6fb; color: #1d2433; }
  header { background: #1d2a4d; color: #fff; padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; }
  header b { letter-spacing: .3px; }
  header a { color: #cdd6f4; text-decoration: none; margin-left: 18px; font-size: 14px; }
  main { max-width: 760px; margin: 36px auto; background: #fff; border-radius: 12px; padding: 32px 36px; box-shadow: 0 6px 24px rgba(20,30,60,.08); }
  h1 { margin: 0 0 6px; font-size: 24px; }
  p.sub { margin: 0 0 24px; color: #5b6478; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  input[type=text], input[type=email], input[type=password], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #c9d0de; border-radius: 8px; font: inherit; }
  textarea { height: 80px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .radios label, .check { display: inline-flex; gap: 6px; font-weight: 400; margin-right: 18px; }
  .err { color: #c0392b; font-size: 13px; }
  button { margin-top: 22px; background: #2f6bff; color: #fff; border: 0; padding: 11px 22px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .ok { background: #e7f7ee; border: 1px solid #9fd8b6; padding: 18px; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3e7ef; }
  footer { text-align: center; color: #8a93a6; font-size: 12px; margin-bottom: 30px; }
</style>
</head>
<body>
<header><b>Acme Leads Portal</b>{% if session.get('user') %}<span><a href="/form">New lead</a><a href="/submissions">Submissions</a><a href="/logout" id="logout">Log out</a></span>{% endif %}</header>
<main>{% block content %}{% endblock %}</main>
<footer>Local practice site shipped with this repo</footer>
</body>
</html>
